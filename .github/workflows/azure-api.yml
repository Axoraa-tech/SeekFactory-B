# Builds the Spring Boot jar and deploys it to the Azure App Service web app.
# Repo settings (Settings → Secrets and variables → Actions):
#   Secret   AZURE_API_PUBLISH_PROFILE  contents of the API web app's downloaded publish profile
#   Variable AZURE_API_APP_NAME         e.g. seekfactory-api
# The web app's startup command runs /home/site/wwwroot/app.jar (see the Azure handover doc).
name: deploy-azure-api

# Manual only (Actions → deploy-azure-api → Run workflow)
on:
  workflow_dispatch:

concurrency:
  group: deploy-azure-api
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The Maven wrapper downloads Maven itself on first use; keep it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Build jar
        run: |
          chmod +x mvnw
          # Maven Central sometimes drops a download; retry, then fall back to the runner's own Maven
          MVN=./mvnw
          for attempt in 1 2 3; do
            if ./mvnw -B -q --version > /dev/null; then break; fi
            if [ "$attempt" = 3 ]; then echo "Wrapper download failed 3 times; using the runner's Maven"; MVN=mvn; break; fi
            echo "Maven download failed (attempt $attempt), retrying in 20 s"; sleep 20
          done
          $MVN -B clean package -DskipTests
          cp target/axoraa-*.jar app.jar
          # OneDeploy rejects type=jar for the Java 25 stack, so ship a zip that unpacks to wwwroot/app.jar
          zip -q app.zip app.jar

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: app.zip
