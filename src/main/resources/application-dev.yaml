spring:
  datasource:
    url: ${DEV_DB_URL:${DB_URL:${DATABASE_URL:${PROD_DB_URL:}}}}
    username: ${DEV_DB_USERNAME:${DB_USERNAME:${PROD_DB_USERNAME:}}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD:${PROD_DB_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Throughput ceiling = pool size / time-in-DB per request, so 5 capped the
      # feed at roughly 4 req/s. Override with DB_POOL_SIZE per environment; keep
      # it inside whatever the database (or its pooler) allows.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 15000
      max-lifetime: 60000
      keepalive-time: 15000
      connection-test-query: "SELECT 1"
      data-source-properties:
        prepareThreshold: 0
        tcpKeepAlive: true
        socketTimeout: 30

  jpa:
    show-sql: false

app:
  auth:
    # No SMS provider yet: phone login accepts this code in development only
    mock-otp: "123456"
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:*
      # Expo web opened via the PC's LAN / hotspot address (dev only)
      - http://192.168.*.*:*
      - http://172.*.*.*:*
      - http://10.*.*.*:*