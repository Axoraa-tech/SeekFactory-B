spring:
  application:
    name: axoraa

  # Load local .env (if present) so DEV_DB_* / JWT_SECRET etc. resolve without
  # exporting them to the shell. Real environment variables take precedence.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Spring's default (1MB per file) rejects seek videos with 413 before MediaStorageService
  # can apply its own per-kind limits (app.media.max-*-size), so the servlet cap sits just above the largest
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:105MB}

  # ─── DataSource (Supports any cloud / local env var names) ───
  datasource:
    url: ${DB_URL:${DATABASE_URL:${DEV_DB_URL:${PROD_DB_URL:}}}}
    username: ${DB_USERNAME:${DEV_DB_USERNAME:${PROD_DB_USERNAME:}}}
    password: ${DB_PASSWORD:${DEV_DB_PASSWORD:${PROD_DB_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Throughput ceiling = pool size / time-in-DB per request, so 5 capped the
      # feed at roughly 4 req/s. Override with DB_POOL_SIZE per environment; keep
      # it inside whatever the database (or its pooler) allows.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Every new connection is a TLS handshake to the remote Supabase pooler, so keep them around:
      # a 60s lifetime replaced the whole pool each minute, and keepalive under 30s was silently ignored.
      # No connection-test-query: the driver's isValid() check avoids an extra SELECT 1 round trip.
      minimum-idle: 4
      idle-timeout: 120000
      connection-timeout: 15000
      max-lifetime: 300000
      keepalive-time: 60000
      data-source-properties:
        prepareThreshold: 0
        tcpKeepAlive: true
        socketTimeout: 30

  # ─── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate            # IMPORTANT: Flyway manages schema, Hibernate only validates
    show-sql: false                  # Set true only during development
    open-in-view: false              # Enterprise best practice: disable OSIV
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ─── Mail (SMTP) ────────────────────────────────────────────
  # Host / port / username / password come from SPRING_MAIL_* env vars (see .env.example).
  # Without SPRING_MAIL_HOST no email is sent (dev logs the message instead).
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true        # port 587; for port 465 set SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # ─── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true
    locations: classpath:db/migration

  # ─── Jackson ─────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: LOWER_CAMEL_CASE

# ─── Application Custom Properties ────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:seekfactory-super-secret-jwt-key-for-development-256bit}
    access-token-expiry: 86400000          # 24 hours in milliseconds
    refresh-token-expiry: 604800000        # 7 days in milliseconds
    issuer: seekfactory-axoraa

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  cors:
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
      - "https://*.vercel.app"
      - "https://seekfactory.com"
      - "https://*.seekfactory.com"

# ─── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ─── OpenAPI / Swagger ────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── Server ───────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # Each request thread costs stack + buffers; 200 (the default) is far more than a 512 MB
      # instance can hold. Raise TOMCAT_MAX_THREADS on a bigger plan.
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: 4
  error:
    include-message: always
    include-binding-errors: always

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
  level:
    seekfactory.axoraa: DEBUG
    org.springframework.web: INFO